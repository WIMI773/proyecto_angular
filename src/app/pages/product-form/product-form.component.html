<div class="form-page">
  <div class="form-wrapper">
    <div class="form-container">

      <!-- Encabezado -->
      <div class="form-header">
        <h1>{{ editing ? 'Editar Producto' : 'Crear Producto' }}</h1>
        <p>
          {{ editing
          ? 'Actualiza la información del producto'
          : 'Agrega un nuevo producto a tu tienda' }}
        </p>
      </div>

      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="save()" class="product-form">

        <!-- Nombre -->
        <div class="form-group">
          <label for="title">Nombre del Producto *</label>
          <input
            id="title"
            type="text"
            formControlName="title"
            placeholder="Ej: Hoodie Classic Negro"
          />
          <span class="error" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
            El nombre es obligatorio
          </span>
        </div>

        <!-- Precio y Categoría -->
        <div class="form-row">

          <div class="form-group">
            <label for="price">Precio ($) *</label>
            <input
              id="price"
              type="number"
              formControlName="price"
              placeholder="Ej: 79.99"
              min="0"
              step="0.01"
            />
            <span class="error" *ngIf="form.get('price')?.invalid && form.get('price')?.touched">
              El precio es requerido
            </span>
          </div>

          <div class="form-group">
            <label for="categoryId">Categoría *</label>
            <select id="categoryId" formControlName="categoryId">
              <option value="1">Clothes</option>
              <option value="2">Electronics</option>
              <option value="3">Furniture</option>
              <option value="4">Shoes</option>
              <option value="5">Others</option>
            </select>
            <span class="error" *ngIf="form.get('categoryId')?.invalid && form.get('categoryId')?.touched">
              La categoría es obligatoria
            </span>
          </div>

        </div>

        <!-- Descripción -->
        <div class="form-group">
          <label for="description">Descripción *</label>
          <textarea
            id="description"
            formControlName="description"
            placeholder="Describe detalladamente el producto..."
          ></textarea>
          <span class="error" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">
            La descripción es obligatoria
          </span>
        </div>

        <!-- Imagen -->
        <div class="form-group">
          <label for="images">URL de la Imagen</label>
          <input
            id="images"
            type="text"
            formControlName="images"
            placeholder="https://ejemplo.com/imagen.jpg"
          />
          <small class="helper-text">
            Se enviará como arreglo a la API
          </small>
        </div>

        <!-- Acciones -->
        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid || loading"
          >
            {{ editing ? 'Actualizar Producto' : 'Crear Producto' }}
          </button>

          <a routerLink="/products" class="btn btn-secondary">
            Cancelar
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
